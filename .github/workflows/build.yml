name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Cross-compile sanity (android arm64)
        run: GOOS=android GOARCH=arm64 go build ./...

      - name: Build
        run: |
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 go build -ldflags "-s -w" -o dist/qulogi-linux-amd64 ./cmd/qulogi
          GOOS=linux   GOARCH=amd64 go build -ldflags "-s -w" -o dist/qulogid-linux-amd64 ./cmd/qulogid
          GOOS=linux   GOARCH=arm64 go build -ldflags "-s -w" -o dist/qulogi-linux-arm64 ./cmd/qulogi
          GOOS=linux   GOARCH=arm64 go build -ldflags "-s -w" -o dist/qulogid-linux-arm64 ./cmd/qulogid
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o dist/qulogi-windows-amd64.exe ./cmd/qulogi
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o dist/qulogid-windows-amd64.exe ./cmd/qulogid
          GOOS=darwin  GOARCH=arm64 go build -ldflags "-s -w" -o dist/qulogi-darwin-arm64 ./cmd/qulogi
          GOOS=darwin  GOARCH=arm64 go build -ldflags "-s -w" -o dist/qulogid-darwin-arm64 ./cmd/qulogid
          GOOS=darwin  GOARCH=amd64 go build -ldflags "-s -w" -o dist/qulogi-darwin-amd64 ./cmd/qulogi
          GOOS=darwin  GOARCH=amd64 go build -ldflags "-s -w" -o dist/qulogid-darwin-amd64 ./cmd/qulogid

      - uses: actions/upload-artifact@v4
        with:
          name: qulogi-core
          path: dist/

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install gomobile
        working-directory: .
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          export ANDROID_NDK_HOME=$(ls -d ${ANDROID_HOME}/ndk/* | tail -1)
          gomobile init

      - name: Build gomobile AAR
        working-directory: .
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          export ANDROID_NDK_HOME=$(ls -d ${ANDROID_HOME}/ndk/* | tail -1)
          gomobile bind -target=android/arm64,android/arm,android/amd64 \
            -androidapi 29 \
            -o app/android/app/libs/mobile.aar ./mobile

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Restore windows platform
        run: flutter create . --project-name qulogi --platforms windows

      - name: Brand windows icon
        run: cp assets/brand/qulogi.ico windows/runner/resources/app_icon.ico

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ../qulogi-${{ github.ref_name }}-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: qulogi-apk
          path: qulogi-*-android.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: qulogi-core
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: qulogi-apk
          path: dist

      - name: Create release notes
        run: |
          cat > dist/RELEASE.md <<'EOF'
          ## Qulogi

          Инструмент обхода «белых списков»: Flutter M3 + Go (только стандартная библиотека).

          ### Файлы
          - `qulogi-*-android.apk` — Android-приложение (SOCKS5 / VPN-режим, автопоиск релеев, умный сплит, storage-webdav)
          - `qulogi-<платформа>` — клиент (локальный SOCKS5)
          - `qulogid-<платформа>` — релей для вашего сервера

          ### Быстрый старт
          ```bash
          qulogid -listen :443 -psk СЕКРЕТ
          qulogi -server relay.example.net:443 -psk СЕКРЕТ -smart-split
          ```

          EN: whitelist-bypass tool (Flutter M3 + stdlib-only Go). APK for Android;
          `qulogi` is the local SOCKS5 client, `qulogid` is the relay. See README.
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/RELEASE.md
          files: |
            dist/qulogi-*
            dist/qulogid-*
          generate_release_notes: true
