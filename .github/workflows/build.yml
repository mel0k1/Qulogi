name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 go build -ldflags "-s -w" -o dist/qulogi-linux-amd64 ./cmd/qulogi
          GOOS=linux   GOARCH=amd64 go build -ldflags "-s -w" -o dist/qulogid-linux-amd64 ./cmd/qulogid
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o dist/qulogi-windows-amd64.exe ./cmd/qulogi
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o dist/qulogid-windows-amd64.exe ./cmd/qulogid
          GOOS=darwin  GOARCH=arm64 go build -ldflags "-s -w" -o dist/qulogi-darwin-arm64 ./cmd/qulogi
          GOOS=darwin  GOARCH=arm64 go build -ldflags "-s -w" -o dist/qulogid-darwin-arm64 ./cmd/qulogid

      - uses: actions/upload-artifact@v4
        with:
          name: qulogi-core
          path: dist/

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Restore platforms
        run: flutter create . --project-name qulogi --platforms android,windows

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: qulogi-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
