name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Cross-compile sanity (android arm64)
        run: GOOS=android GOARCH=arm64 go build ./...

      - name: Build
        run: |
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 go build -ldflags "-s -w" -o dist/qulogi-linux-amd64 ./cmd/qulogi
          GOOS=linux   GOARCH=amd64 go build -ldflags "-s -w" -o dist/qulogid-linux-amd64 ./cmd/qulogid
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o dist/qulogi-windows-amd64.exe ./cmd/qulogi
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o dist/qulogid-windows-amd64.exe ./cmd/qulogid
          GOOS=darwin  GOARCH=arm64 go build -ldflags "-s -w" -o dist/qulogi-darwin-arm64 ./cmd/qulogi
          GOOS=darwin  GOARCH=arm64 go build -ldflags "-s -w" -o dist/qulogid-darwin-arm64 ./cmd/qulogid

      - uses: actions/upload-artifact@v4
        with:
          name: qulogi-core
          path: dist/

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install gomobile
        working-directory: .
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          export ANDROID_NDK_HOME=$(ls -d ${ANDROID_HOME}/ndk/* | tail -1)
          gomobile init

      - name: Build gomobile AAR
        working-directory: .
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          export ANDROID_NDK_HOME=$(ls -d ${ANDROID_HOME}/ndk/* | tail -1)
          gomobile bind -target=android/arm64,android/arm,android/amd64 \
            -androidapi 29 \
            -o app/android/app/libs/mobile.aar ./mobile

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Restore windows platform
        run: flutter create . --project-name qulogi --platforms windows

      - name: Brand windows icon
        run: cp assets/brand/qulogi.ico windows/runner/resources/app_icon.ico

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: qulogi-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
